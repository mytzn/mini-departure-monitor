[platformio]
extra_configs = platformio.local.ini

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:seeed_xiao_esp32c6]
;platform = espressif32
;board = seeed_xiao_esp32c6
;framework = arduino
;lib_deps =
;  zinggjm/GxEPD2@^1.5.8
;  bblanchon/ArduinoJson@^7.0.4
;  olikraus/U8g2@^2.35.19
;  olikraus/U8g2_for_Adafruit_GFX@^1.8.0

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; The embedded setup UI now lives inside the app image, so use a dual-slot OTA layout.
board_build.partitions = partitions_ota_8mb.csv
extra_scripts = pre:tools/build_web_assets.py
; Keep native USB CDC enabled so the board exposes a serial port after boot.
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  zinggjm/GxEPD2@^1.5.8
  bblanchon/ArduinoJson@^7.0.4
  olikraus/U8g2@^2.35.19
  olikraus/U8g2_for_Adafruit_GFX@^1.8.0
  ricmoo/QRCode@^0.0.1
